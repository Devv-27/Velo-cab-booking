# Replace {{DOMAIN}} with your domain. Get the certificate with: certbot certonly --nginx -d {{DOMAIN}}
server { listen 80; server_name {{DOMAIN}}; return 301 https://$host$request_uri; }
server {
  listen 443 ssl http2; server_name {{DOMAIN}};
  ssl_certificate /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  location /ws { proxy_pass http://127.0.0.1:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 3600s; }
  location / { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}
