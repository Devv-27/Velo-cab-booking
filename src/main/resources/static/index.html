button{transition:transform .2s var(--ease),filter .2s var(--ease),box-shadow .2s var(--ease)}

const liveEl=document.createElement('div');liveEl.style.cssText='height:340px;border-radius:18px;overflow:hidden';
const cm=(p,c,r,tip,fn)=>{const m=L.circleMarker(p,{radius:r,color:'#fff',weight:2,fillColor:c,fillOpacity:1}).bindTooltip(esc(tip));if(fn)m.on('click',fn);return m};
function liveMap(){const ph=$('#lm');if(!ph)return;if(!LM){LM=L.map(liveEl).setView([20.2961,85.8245],11);tiles().addTo(LM);LG=L.layerGroup().addTo(LM)}
 if(liveEl.parentNode!==ph)ph.appendChild(liveEl);LM.invalidateSize();LG.clearLayers();const pts=[],busy=new Set();
 D.rs.filter(r=>['ACCEPTED','ARRIVED','STARTED'].includes(r.status)&&r.driverId).forEach(r=>{const u=D.us.find(x=>x.id==r.driverId);if(!u||!(u.lat||u.lng))return;busy.add(u.id);
  const p=[u.lat,u.lng],t=r.status=='STARTED'?[r.dLat,r.dLng]:[r.pLat,r.pLng];
  L.polyline([p,t],{color:'#e2c25a',weight:2,dashArray:'4 6'}).addTo(LG);cm(t,'#a32749',5,(r.status=='STARTED'?'Drop':'Pickup')+' for ride #'+r.id).addTo(LG);
  cm(p,'#e2c25a',10,'Ride #'+r.id+' · '+r.driverName+' · '+r.status,()=>openRide(r.id)).addTo(LG);pts.push(p,t)});
 D.us.filter(u=>u.role=='DRIVER'&&u.active&&u.available&&(u.lat||u.lng)&&!busy.has(u.id)).forEach(u=>{const p=[u.lat,u.lng];cm(p,'#f6f1e7',7,u.name+' · online, free').addTo(LG);pts.push(p)});
 D.rs.filter(r=>r.status=='REQUESTED').forEach(r=>{const p=[r.pLat,r.pLng];cm(p,'#a32749',7,'Waiting: ride #'+r.id,()=>openRide(r.id)).addTo(LG);pts.push(p)});
 if(pts.length&&!LM._fit){LM._fit=true;LM.fitBounds(pts,{padding:[40,40],maxZoom:15})}}
const dur=(a,b)=>a&&b?Math.max(0,Math.round((new Date(b)-new Date(a))/60000))+' min':'-',tm=v=>v?new Date(v).toLocaleString():'-';
const row=(a,b)=>`<div class=h><span>${esc(a)}</span><span>${esc(b)}</span></div>`;
function rideDetail(x){LD=x;const r=x.ride,d=x.driver,p=x.rider,tr=x.track,live=d&&['ACCEPTED','ARRIVED','STARTED'].includes(r.status);
 const tl=[['Requested',r.created],['Driver accepted',r.acceptedAt],['Driver arrived',r.arrivedAt],['Trip started',r.startedAt],['Trip completed',r.completed],['Cancelled'+(r.cancelledBy?' by '+r.cancelledBy:''),r.cancelledAt]].filter(t=>t[1]);
 return`<div class=seg style="flex-wrap:nowrap"><span class=tag>${esc(r.status)}</span>${r.sos?'<span class=tag>SOS ACTIVE</span>':''}</div>
 <h3>Timeline</h3>${tl.map(t=>row(t[0],tm(t[1]))).join('')}${row('Time to accept',dur(r.created,r.acceptedAt))}${row('Trip duration',dur(r.startedAt,r.completed))}
 <h3>Trip</h3><div class=pt>${esc(r.pickup)}</div><div class=pt>${esc(r.drop)}</div>${row('Distance',r.distanceKm+' km')}${row('Pickup coordinates',r.pLat.toFixed(5)+', '+r.pLng.toFixed(5))}${row('Drop coordinates',r.dLat.toFixed(5)+', '+r.dLng.toFixed(5))}
 <h3>People</h3><div class=card><b>Rider</b>${p?`<div class=m>${esc(p.name)} · ${esc(p.email)} · ${esc(p.phone||'no phone')}</div>`:'<div class=m>Unknown</div>'}</div>
 <div class=card><b>Driver</b>${d?`<div class=m>${esc(d.name)} · ${esc(d.email)} · ${esc(d.phone||'no phone')}</div><div class=m>${esc([d.color,d.vehicle,d.plate].filter(Boolean).join(' ')||'No vehicle details')} · ${star(d.rating,d.ratingCount)}</div>`:'<div class=m>Not assigned yet</div>'}</div>
 <h3>Money</h3>${row('Fare','₹'+r.fare)}${row('Payment',r.paid?'Paid':r.status=='COMPLETED'?'Awaiting payment':'Not due yet')}${row('Driver gets','₹'+x.driverShare+(r.paid?'':' (after payment)'))}${row('Platform profit',r.paid?'₹'+x.profit:'-')}${row('Rider rating',r.rating??'-')}
 <h3>Tracking</h3>${row('Route points recorded',tr.length)}${tr.length?row('First point',tm(tr[0].at))+row('Latest point',tm(tr[tr.length-1].at)):''}${live&&d.at?row('Driver last seen',Math.round((Date.now()-new Date(d.at))/1000)+'s ago'):''}
 ${live&&(d.lat||d.lng)?`<a href="https://www.openstreetmap.org/?mlat=${Number(d.lat)}&amp;mlon=${Number(d.lng)}#map=16/${Number(d.lat)}/${Number(d.lng)}" target=_blank rel=noopener>Open the driver's position</a>`:''}
 <div class=seg>${A.includes(r.status)?`<button class=d onclick="cancelRide(${Number(r.id)})">Cancel ride</button>`:''}${r.sos?`<button onclick="resolveSos(${Number(r.id)})">Mark resolved</button>`:''}<button class=s onclick=copyRide()>Copy summary</button><button class=s onclick=window.print()>Print</button><button class=s onclick=closeSheet()>Close</button></div>`}
async function rideMapDraw(x,first){const r=x.ride,a=[r.pLat,r.pLng],b=[r.dLat,r.dLng],line=await rt(a,b);if(!DMap)return;DG.clearLayers();
 L.polyline(line,{color:'#e2c25a',weight:4,opacity:.5}).addTo(DG);const tr=x.track.map(p=>[p.lat,p.lng]);if(tr.length>1)L.polyline(tr,{color:'#f6f1e7',weight:3,dashArray:'6 6'}).addTo(DG);
 cm(a,'#e2c25a',8,'Pickup').addTo(DG);cm(b,'#a32749',8,'Drop').addTo(DG);const d=x.driver;
 if(d&&(d.lat||d.lng)&&['ACCEPTED','ARRIVED','STARTED'].includes(r.status))cm([d.lat,d.lng],'#f6f1e7',10,'Driver, live').addTo(DG);
 if(first)DMap.fitBounds([a,b,...tr],{padding:[30,30]})}
async function refreshRide(id){try{const x=await api('/admin/rides/'+id);if(!DMap)return;$('#dd').innerHTML=rideDetail(x);rideMapDraw(x,false);if(!A.includes(x.ride.status))clearInterval(RT)}catch(e){}}
async function openRide(id){try{clearInterval(RT);if(DMap){DMap.remove();DMap=null}const x=await api('/admin/rides/'+id);
 sheet(`<h2>Ride #${Number(x.ride.id)}</h2><div id=dm style="height:280px;border-radius:18px;overflow:hidden"></div><div id=dd>${rideDetail(x)}</div>`,720);
 DMap=L.map('dm').setView([x.ride.pLat,x.ride.pLng],13);tiles().addTo(DMap);DG=L.layerGroup().addTo(DMap);rideMapDraw(x,true);
 if(A.includes(x.ride.status))RT=setInterval(()=>refreshRide(id),3000)}catch(e){toast(e.message)}}
const theme=()=>document.documentElement.dataset.theme||'light';
function toggleTheme(){const n=theme()=='light'?'dark':'light';document.documentElement.dataset.theme=n;try{localStorage.theme=n}catch(e){}topbar();if(U&&U.role!='ADMIN')draw()}
function ready(){const l=$('#load');if(!l||l.classList.contains('out'))return;setTimeout(()=>{l.classList.add('out');setTimeout(()=>l.remove(),600);setTimeout(showCk,900)},Math.max(0,1000-performance.now()))}
setTimeout(ready,4500);
// ---------- site features: copy, receipt, forms, modals, menu, search, scroll ----------
let LD=null,SE=null;
const CHK='<svg class=chk viewBox="0 0 24 24" fill=none stroke="currentColor" stroke-width=2.4 stroke-linecap=round stroke-linejoin=round aria-hidden=true><circle cx=12 cy=12 r=10 opacity=".35"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>';
function copyText(t){const done=()=>toast('Copied');function fb(){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast('Copy failed')}a.remove()}
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fb);else fb()}
const copyTrip=()=>{const a=S.act,d=S.drv;if(!a||!d)return;copyText(`Velo ride #${a.id}: ${a.pickup} to ${a.drop}. Driver ${d.name}, ${[d.color,d.vehicle].filter(Boolean).join(' ')}${d.plate?' ('+d.plate+')':''}.`)};
const copyRide=()=>{if(!LD)return;const r=LD.ride;copyText(`Ride #${r.id} (${r.status}): ${r.pickup} to ${r.drop}, ${r.distanceKm} km, fare Rs ${r.fare}. Rider: ${LD.rider?LD.rider.name:'none'}. Driver: ${LD.driver?LD.driver.name:'none'}.`)};
async function receipt(id){try{const x=await api('/rides/'+id),r=x.ride,d=x.driver,l=(a,b)=>`<div class=h><span>${esc(a)}</span><span>${esc(b)}</span></div>`;
 sheet(`<h2>Receipt</h2><p class=m>Velo, ride #${Number(r.id)}</p>${l('Date',tm(r.created))}${l('From',r.pickup)}${l('To',r.drop)}${l('Distance',r.distanceKm+' km')}${d?l('Driver',d.name):''}${d&&d.plate?l('Vehicle',[d.color,d.vehicle,d.plate].filter(Boolean).join(' ')):''}<div class=big>₹${r.fare}<small>${r.paid?'Paid':'Not paid'}</small></div><div class=seg><button onclick=window.print()>Print</button><button class=s onclick=closeSheet()>Close</button></div>`)}catch(e){toast(e.message)}}
// form helpers
const pw=(id,ph,auto)=>`<div class=pw><input id=${id} type=password placeholder="${esc(ph)}" autocomplete=${auto}><button type=button class="s tg" aria-pressed=false onclick="showPw('${id}',this)">Show</button></div>`;
const showPw=(id,b)=>{const i=$('#'+id),s=i.type=='password';i.type=s?'text':'password';b.textContent=s?'Hide':'Show';b.setAttribute('aria-pressed',s)};
function setErr(id,msg){if(!id)return;const e=$('#E_'+id),i=$('#'+id);if(e)e.textContent=msg||'';if(i&&i.matches('input,textarea'))i.classList.toggle('err',!!msg)}
function authSubmit(reg){const g=id=>$('#'+id).value.trim();['n','e','p','form'].forEach(k=>setErr(k,''));let ok=true;
 if(reg&&!g('n')){setErr('n','Enter your name');ok=false}
 if(!/^[^@\s]{1,64}@[^@\s]{1,190}$/.test(g('e'))){setErr('e','Enter a valid email address');ok=false}
 const pv=$('#p').value;if(!pv){setErr('p','Enter your password');ok=false}else if(reg&&pv.length<8){setErr('p','Use at least 8 characters');ok=false}
 if(!ok)return;const b={email:g('e'),password:pv};if(reg){b.name=g('n');b.role=document.querySelector('[name=r]:checked').value;Object.assign(b,utmBody())}
 const btn=$('#go'),label=btn.textContent;btn.disabled=true;btn.textContent='Please wait';
 api('/auth/'+(reg?'register':'login'),'POST',b).then(j=>{T=j.token;U=j.user;sessionStorage.t=T;sessionStorage.u=JSON.stringify(U);
  $('#fi').innerHTML=`<div class=done>${CHK}<h2>${reg?'Account created':'You are logged in'}</h2><p class=m>Opening Velo</p></div>`;setTimeout(()=>location.reload(),800)})
 .catch(e=>{setErr('form',e.message);btn.disabled=false;btn.textContent=label})}
// campaign tags (utm) kept for the session and sent with sign up
(function(){try{const q=new URLSearchParams(location.search),o={};['utm_source','utm_medium','utm_campaign'].forEach(k=>{const v=(q.get(k)||'').replace(/[^A-Za-z0-9 _.+-]/g,'').slice(0,60);if(v)o[k]=v});if(Object.keys(o).length&&!sessionStorage.utm)sessionStorage.utm=JSON.stringify(o)}catch(e){}})();
function utmBody(){try{const o=JSON.parse(sessionStorage.utm||'{}');return{utmSource:o.utm_source,utmMedium:o.utm_medium,utmCampaign:o.utm_campaign}}catch(e){return{}}}
// fare estimator for visitors
async function geo(q){const j=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q))).json();if(!j[0])throw new Error('Could not find "'+q+'"');return[+j[0].lat,+j[0].lon]}
async function fareDemo(){const f=$('#ef').value.trim(),t=$('#et').value.trim(),o=$('#eo');o.className='m';
 if(!f||!t){o.className='ferr';o.textContent='Enter both places.';return}
 o.textContent='Working it out';
 try{const a=await geo(f),b=await geo(t),r=await api('/public/estimate','POST',{pLat:a[0],pLng:a[1],dLat:b[0],dLng:b[1]});o.className='okmsg';o.textContent='About ₹'+r.fare+' for '+r.distanceKm+' km, around '+r.etaMin+' min. Create an account to book.'}
 catch(e){o.className='ferr';o.textContent=e.message||'Could not work that out. Try again.'}}
// confirmation modal
function confirmBox(t,m,ok,fn,danger=true){const c=$('#cf');c.hidden=false;c.innerHTML=`<div class="glass box" role=alertdialog aria-modal=true aria-labelledby=cft><h2 id=cft>${esc(t)}</h2><p class=m>${esc(m)}</p><div class=seg><button class=s id=cfn>Keep it</button><button class="${danger?'d':''}" id=cfy>${esc(ok)}</button></div></div>`;
 const close=()=>{c.hidden=true;c.innerHTML=''};$('#cfn').onclick=close;$('#cfy').onclick=()=>{close();fn()};c.onclick=e=>{if(e.target===c)close()};$('#cfn').focus()}
const askCancel=id=>confirmBox('Cancel this ride?','The ride is cancelled for everyone. This cannot be undone.','Cancel ride',()=>act('/rides/'+id+'/cancel'));
const askSos=id=>confirmBox('Send an SOS alert?','Velo admins are alerted with your ride number. This does not call the police or an ambulance. In an emergency call your local emergency number first.','Send SOS',()=>sos(id));
// help with search, support form states
const ticketForm=()=>`<div><input id=ts maxlength=80 placeholder="Subject"><div class=ferr id=E_ts role=alert></div></div><div><textarea id=tm maxlength=1000 placeholder="Describe the problem. If it is about a ride, include the ride number."></textarea><div class=ferr id=E_tm role=alert></div></div><div class=ferr id=E_tf role=alert></div><button onclick=sendTicket()>Send message</button>`;
async function help(focus){let t=[];if(U&&U.role!='ADMIN'){try{t=await api('/tickets')}catch(e){}}
 const seen=new Set(),L=(U?(FAQ[U.role]||[]):[...FAQ.RIDER,...FAQ.DRIVER]).filter(q=>!seen.has(q[0])&&seen.add(q[0]));
 sheet(`<div class=h style="align-items:center"><h2>Help</h2><span>Policies updated October 17, 2026</span></div>${L.length?`<input id=hs placeholder="Search help" oninput="helpSearch(this.value)" autocomplete=off><div id=faq>${L.map(q=>`<details><summary>${esc(q[0])}</summary><p>${esc(q[1])}</p></details>`).join('')}</div><p class=m id=hn hidden>No answers match that. Try fewer words.</p>`:''}
 ${!U?'<p class=m>Log in to message support.</p>':U.role=='ADMIN'?'':`<h3>Contact support</h3><div id=tf>${ticketForm()}</div>${t.length?'<h3>Your messages</h3>'+t.map(x=>`<div class=card><b>${esc(x.subject)}</b><div class=m>${esc(x.message)}</div><div class=h><span>${esc(x.status)} · ${fmt(x.created)}</span></div>${x.reply?`<div>Reply: ${esc(x.reply)}</div>`:''}</div>`).join(''):''}`}
 <p class=m><a href=/privacy.html target=_blank rel=noopener>Privacy Policy</a> · <a href=/terms.html target=_blank rel=noopener>Terms</a></p><button class=s onclick=closeSheet()>Close</button>`);
 if(focus=='contact'&&$('#ts'))$('#ts').scrollIntoView({block:'center'})}
function helpSearch(v){const q=v.trim().toLowerCase();let n=0;document.querySelectorAll('#faq details').forEach(d=>{const m=!q||d.textContent.toLowerCase().includes(q);d.hidden=!m;if(m)n++;d.open=!!q&&m});$('#hn').hidden=n>0}
function sendTicket(){['ts','tm','tf'].forEach(k=>setErr(k,''));const s=$('#ts').value.trim(),m=$('#tm').value.trim();let ok=true;
 if(!s){setErr('ts','Add a subject');ok=false}if(m.length<10){setErr('tm','Write at least 10 characters');ok=false}if(!ok)return;
 api('/tickets','POST',{subject:s,message:m}).then(x=>{$('#tf').innerHTML=`<div class=done>${CHK}<h3>Message sent</h3><p class=m>Reference #${Number(x.id)}. Replies appear under Your messages.</p><button class=s onclick="help('contact')">Send another</button></div>`}).catch(e=>setErr('tf',e.message))}
function saveProfile(){const b={name:$('#pn').value,phone:$('#pp').value};if($('#pv')){b.vehicle=$('#pv').value;b.color=$('#pc').value;b.plate=$('#pl').value}
 const o=$('#ps');o.className='m';o.textContent='Saving';

// menu, notice, scroll, skip link

 if(S.act&&S.act.driverId){const d=await api('/rides/'+S.act.id);S.drv=d.driver;S.rider=d.rider||null;S.otp=d.otp||null;S.earn=d.earning??null;S.act=d.ride}
 if(D){S.stat=await api('/driver/stats');if(!S.me&&(S.stat.lat||S.stat.lng))S.me=[S.stat.lat,S.stat.lng];S.reqs=!S.act&&S.stat.available?await api('/driver/requests'):[];if(!S.demo&&S.me&&(S.act||S.stat.available))await api('/driver/status','POST',{lat:S.me[0],lng:S.me[1]});if(S.act&&S.demo)await simulate()}

 detect();const g=JSON.stringify([U.role=='RIDER'&&S.drv?[Math.round(S.drv.lat*1e4),Math.round(S.drv.lng*1e4)]:0,S.mine.map(r=>[r.id,r.status,r.paid,r.rating]),S.reqs.map(r=>r.id),S.stat&&[S.stat.earnings,S.stat.trips,S.stat.available,S.stat.rating],S.skip.size]);if(g!=sig){sig=g;render()}draw()}catch(e){}}

if(!U){authView();ready()}else if(U.role=='ADMIN'){$('#panel').hidden=true;connect();adminView().finally(ready);setInterval(adminView,6000)}
